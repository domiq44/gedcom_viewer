[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.coverage.run]
source = ["gedcom", "controllers", "ui", "main"]
omit = ["tests/*", "benchmarks/*", "scripts/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = [
    "gedcom",
    "controllers",
    "ui",
    "main.py",
    "benchmarks",
    "scripts",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gedcom-viewer"
version = "1.0.0"
description = "Explorateur GEDCOM 5.5.1 en lecture seule"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["Pillow==13.0.0", "pypdfium2==5.15.2"]

[project.scripts]
gedcom-viewer = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["gedcom", "gedcom.models", "controllers", "ui", "ui.views"]

[tool.setuptools.package-data]
ui = ["locales/*.json"]