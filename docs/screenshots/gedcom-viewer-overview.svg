  <text x="352" y="180" font-family="Arial, sans-serif" font-size="18" fill="#6b7280">Contenu brut du fichier</text>

  <text x="862" y="132" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2937">Vue de l’entité</text>
