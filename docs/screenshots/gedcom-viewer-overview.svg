<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">GEDCOM Viewer overview</title>
  <desc id="desc">Mockup d’une interface de visualisation GEDCOM en Tkinter avec panneau gauche, panneau central GEDCOM et onglets de détails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#eef2f8"/>
    </linearGradient>
    <rect id="panel" width="100" height="100" rx="12" fill="#ffffff" stroke="#d7deea"/>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect x="20" y="20" width="1360" height="860" rx="18" fill="#ffffff" stroke="#d0d7e3"/>

  <rect x="40" y="48" width="194" height="36" rx="10" fill="#e8edf7"/>
  <rect x="284" y="48" width="240" height="36" rx="10" fill="#e8edf7"/>
  <rect x="572" y="48" width="260" height="36" rx="10" fill="#e8edf7"/>
  <rect x="892" y="48" width="150" height="36" rx="10" fill="#e8edf7"/>

  <rect x="40" y="97" width="250" height="744" rx="16" fill="#f8faff" stroke="#dce3ef"/>
  <rect x="310" y="97" width="510" height="744" rx="16" fill="#fbfdff" stroke="#dce3ef"/>
  <rect x="840" y="97" width="520" height="744" rx="16" fill="#fbfdff" stroke="#dce3ef"/>

  <text x="60" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Type d’entité</text>
  <rect x="60" y="148" width="190" height="42" rx="8" fill="#ffffff" stroke="#c9d2e2"/>
  <text x="78" y="176" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">INDI</text>

  <text x="60" y="225" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Recherche</text>
  <rect x="60" y="245" width="190" height="42" rx="8" fill="#ffffff" stroke="#c9d2e2"/>

  <text x="60" y="330" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">Entités</text>
