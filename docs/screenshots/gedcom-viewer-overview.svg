  <text x="80" y="390" font-family="Arial, sans-serif" font-size="18" fill="#374151">@I1@</text>
  <text x="80" y="425" font-family="Arial, sans-serif" font-size="18" fill="#374151">@F1@</text>
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="18" fill="#374151">@S1@</text>
  <text x="80" y="495" font-family="Arial, sans-serif" font-size="18" fill="#374151">@N1@</text>
  <text x="80" y="530" font-family="Arial, sans-serif" font-size="18" fill="#374151">@O1@</text>

  <text x="332" y="132" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2937">GEDCOM</text>
